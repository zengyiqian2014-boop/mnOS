name: Deploy mnOS Pages
on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/pages.yml']
  workflow_dispatch:
  workflow_run:
    workflows: ['Publish tested update resources', 'Refresh the unified resource catalog']
    types: [completed]
permissions:
  contents: read
concurrency:
  group: mnos-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check download selection and script syntax
        run: |
          node --check website/app.mjs
          node --check website/film.mjs
          node --test website/scripts/catalog.test.mjs
      - name: Verify published catalog with the pinned archive key
        run: |
          curl --fail --location --silent --show-error --retry 3 --max-time 60 \
            https://raw.githubusercontent.com/zengyiqian2014-boop/mnOS/resources/catalog.json.asc \
            -o "$RUNNER_TEMP/catalog.json.asc"
          gpgv --keyring "$PWD/live/keys/mnos-archive.gpg" \
            --output "$RUNNER_TEMP/catalog.json" "$RUNNER_TEMP/catalog.json.asc"
      - name: Package static page
        run: MNOS_SITE_CATALOG="$RUNNER_TEMP/catalog.json" node website/scripts/build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
