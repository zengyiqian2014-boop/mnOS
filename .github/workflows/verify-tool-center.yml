name: Verify GUI input on unchanged installer payloads
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful unified installer source run
        required: true
permissions:
  contents: read
  actions: read
jobs:
  gui:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN: ${{ inputs.build_run }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - name: Check successful installer source
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" > /tmp/source.json
          jq -e --arg repo "$GH_REPO" '.repository.full_name == $repo and .path == ".github/workflows/installer.yml" and .conclusion == "success"' /tmp/source.json
      - uses: actions/download-artifact@v4
        with:
          name: mnOS-installer-${{ matrix.arch }}
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
          path: image
      - name: Open the exact payload and compile the external screenshot observer
        run: |
          set -euo pipefail
          (cd image && sha256sum -c "mnOS-2.0-preview-installer-$ARCH.iso.sha256")
          mkdir -p evidence
          cp "image/mnOS-2.0-preview-installer-$ARCH.iso.sha256" evidence/
          printf '%s\n' "$SOURCE_RUN" > evidence/build-run.txt
          printf '%s\n' "$GITHUB_SHA" > evidence/gui-test-commit.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xorriso squashfs-tools gcc libgtk-3-dev
          gcc -std=c11 -O2 -Wall -Wextra -Werror live/tests/window-capture.c $(pkg-config --cflags --libs gtk+-3.0) -o evidence/window-capture
          xorriso -osirrox on -indev "image/mnOS-2.0-preview-installer-$ARCH.iso" -extract /live/filesystem.squashfs /tmp/payload.squashfs
          sudo unsquashfs -no-progress -d /tmp/mnos-payload /tmp/payload.squashfs
          sudo tar -C /tmp/mnos-payload -cf - . | docker import - mnos-gui-payload
      - name: Verify real ordinary-user keyboard input and GUI windows offline
        run: |
          set -euo pipefail
          docker run --rm --network none -v "$PWD/live:/source:ro" -v "$PWD/evidence:/evidence" mnos-gui-payload sh -ec '
            install -d -o 65534 -g 65534 /tmp/mnos-gui
            chown 65534:65534 /evidence
            runuser -u nobody -- env HOME=/tmp/mnos-gui timeout 180 xvfb-run -a dbus-run-session -- sh /source/tests/tool-center-gui.sh' 2>&1 | tee evidence/gui-test.log
          (cd image && sha256sum -c "mnOS-2.0-preview-installer-$ARCH.iso.sha256")
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tool-center-input-${{ matrix.arch }}
          path: |
            evidence/*.png
            evidence/*.log
            evidence/*.txt
            evidence/*.sha256
          retention-days: 14
