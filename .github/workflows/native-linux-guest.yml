name: Native GUI with real Linux guest
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - 'live/src/package.cpp'
      - 'live/src/install-notice.hpp'
      - 'live/src/mnos-locale.h'
      - '.github/workflows/native-linux-guest.yml'
permissions:
  contents: read
jobs:
  native:
    name: native (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - name: Register the build-only RISC-V userspace emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support
          sudo update-binfmts --enable qemu-riscv64
          grep -q '^enabled' /proc/sys/fs/binfmt_misc/qemu-riscv64
      - name: Build original host and pinned Linux guest
        run: |
          docker build -t mnos-native-builder -f native/Builder.Dockerfile .
          docker run --rm --privileged -v "$PWD/native:/native" -v "$PWD/live/src:/mnos-live-src:ro" -e MNOS_LIVE_SOURCE=/mnos-live-src -e ARCHES="$ARCH" -w /native mnos-native-builder bash -ec '
            mkdir -p build
            make host-tests
            if ! guest/build.sh > build/guest-source-build.log 2>&1; then
              tail -100 build/guest-source-build.log
              exit 1
            fi
            if ! bash guest/build-debian.sh > build/debian-rootfs-build.log 2>&1; then
              tail -100 build/debian-rootfs-build.log
              exit 1
            fi
            if [ "$ARCHES" = amd64 ]; then
              bash guest/fetch-debian-sources.sh > build/debian-sources.log 2>&1
            fi
            bash tests/guest_build.sh
            GUEST=1 installer/build.sh
            c++ -std=c++17 -O2 -Wall -Wextra -Werror tests/desktop_vm.cpp -o build/desktop-vm
            c++ -std=c++17 -O2 -Wall -Wextra -Werror tests/firmware_vm.cpp -o build/firmware-vm'
      - name: Boot firmware TPM fallback without CPU or VirtIO random devices
        if: matrix.arch == 'amd64'
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/native:/native" -w /native mnos-native-builder bash -ec '
            set -o pipefail
            build/firmware-vm build/desktop build/desktop 2>&1 | tee build/desktop/firmware-validation.log'
      - name: Install and execute guest Linux in the native desktop
        run: |
          set -euo pipefail
          devices=()
          if [ -c /dev/kvm ]; then devices+=(--device /dev/kvm); fi
          docker run --rm "${devices[@]}" -e MNOS_TEST_LINUX_GUEST=1 -e MNOS_TEST_SLOW_ATA=1 -e ARCH \
            -v "$PWD/native:/native" -w /native mnos-native-builder bash -ec '
            set -o pipefail
            build/desktop-vm build/desktop "$ARCH" 2>&1 | tee "build/desktop/guest-validation-$ARCH.log"'
      - name: Stage the tested architecture and matching sources
        run: |
          set -euo pipefail
          mkdir candidate
          grep -q "NATIVE LINUX GUEST PASS $ARCH" "native/build/desktop/guest-validation-$ARCH.log"
          grep -q "LINUX APPLICATIONS PASS $ARCH" "native/build/desktop/guest-validation-$ARCH.log"
          grep -q "DESKTOP PASS $ARCH" "native/build/desktop/guest-validation-$ARCH.log"
          cp "native/build/desktop/mnOS-0.4-desktop-installer-$ARCH.iso" "candidate/mnOS-native-linux-apps-preview-$ARCH.iso"
          cp native/build/guest/DEBIAN-PACKAGES.tsv "candidate/DEBIAN-PACKAGES-$ARCH.tsv"
          printf '%s\n' "$GITHUB_SHA" > "candidate/SOURCE_COMMIT-$ARCH.txt"
          (cd native/build/desktop && tar -czf "../../../candidate/validation-$ARCH.tar.gz" -- *.log *-linux-guest*.ppm *-support.ppm)
          if [ "$ARCH" = amd64 ]; then
            cp native/build/guest/{SOURCES.sha256,linux.config,busybox.config} candidate/
            cp native/guest/README.md candidate/GUEST_BUILD.md
            cp EDITIONS.md EDITIONS.zh.md candidate/
            tar -C native/build/guest-source -cf candidate/linux-guest-upstream-sources.tar linux-6.12.114.tar.xz busybox-1.37.0.tar.bz2 musl-1.2.5.tar.gz
            tar -C native/build/debian-sources -cf candidate/debian-corresponding-sources.tar .
            git archive --format=tar.gz -o candidate/mnos-native-source.tar.gz HEAD native live/src/package.cpp live/src/install-notice.hpp live/src/mnos-locale.h EDITIONS.md EDITIONS.zh.md LICENSE .github/workflows/native-linux-guest.yml
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-linux-guest-evidence-${{ matrix.arch }}
          path: |
            native/build/*.log
            native/build/desktop/*.log
            native/build/desktop/*-linux-guest*.ppm
            native/build/desktop/*.log.ppm
            native/build/guest-source-build.log
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: native-linux-guest-part-${{ matrix.arch }}
          path: candidate/
          retention-days: 14
          compression-level: 0
  package:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: native-linux-guest-part-*
          merge-multiple: true
          path: release
      - name: Require both tested architectures at the same source and package versions
        run: |
          set -euo pipefail
          mkdir evidence
          for arch in amd64 arm64; do
            test "$(cat "release/SOURCE_COMMIT-$arch.txt")" = "$GITHUB_SHA"
            tar -xf "release/validation-$arch.tar.gz" -C evidence
            grep -q "NATIVE LINUX GUEST PASS $arch" "evidence/guest-validation-$arch.log"
            grep -q "LINUX APPLICATIONS PASS $arch" "evidence/guest-validation-$arch.log"
            grep -q "DESKTOP PASS $arch" "evidence/guest-validation-$arch.log"
          done
          cmp release/DEBIAN-PACKAGES-amd64.tsv release/DEBIAN-PACKAGES-arm64.tsv
          cp release/DEBIAN-PACKAGES-amd64.tsv release/DEBIAN-PACKAGES.tsv
          grep -q 'FIRMWARE RNG BOOT PASS: CPU RNG and VirtIO RNG absent, TPM allows enrollment' evidence/firmware-validation.log
          grep -q 'FIRMWARE RNG BOOT PASS: CPU RNG and VirtIO RNG absent, TPM missing fails closed' evidence/firmware-validation.log
          tar -C evidence -czf release/native-installation-validation.tar.gz .
          rm -- release/validation-amd64.tar.gz release/validation-arm64.tar.gz
          printf '%s\n' "$GITHUB_SHA" > release/SOURCE_COMMIT.txt
          printf 'Validation: https://github.com/%s/actions/runs/%s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > release/PROVENANCE.txt
          (cd release && sha256sum *.iso *.tar *.tar.gz *.config *.txt *.md *.tsv SOURCES.sha256 > SHA256SUMS && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: native-linux-guest-release
          path: release/
          retention-days: 14
          compression-level: 0
