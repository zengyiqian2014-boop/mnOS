name: Export public build diagnostics
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Trusted run in this repository
        required: true
      job_id:
        description: Completed job (optional if the whole run has completed)
        required: false
permissions:
  actions: read
  contents: write
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ inputs.run_id }}
      JOB_ID: ${{ inputs.job_id }}
    steps:
      - name: Export the existing public logs through a release asset
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          test "$GH_REPO" = zengyiqian2014-boop/mnOS
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID" > run.json
          jq -e --arg repo "$GH_REPO" '
            .repository.full_name == $repo and .head_repository.full_name == $repo and
            (.event == "push" or .event == "workflow_dispatch")' run.json >/dev/null
          # Some build clients cannot reach the Actions blob storage endpoint.
          # Preserve the same already-public diagnostic log, without rebuilding
          # or accepting an executable from an artifact or pull-request branch.
          name="ci-$RUN_ID"
          if [ -n "$JOB_ID" ]; then
            [[ "$JOB_ID" =~ ^[0-9]+$ ]]
            gh api "repos/$GH_REPO/actions/jobs/$JOB_ID" > job.json
            jq -e --argjson run "$RUN_ID" '.run_id == $run and .status == "completed"' job.json >/dev/null
            name="$name-$JOB_ID"
            gh api "repos/$GH_REPO/actions/jobs/$JOB_ID/logs" > "$name.log"
          else
            jq -e '.status == "completed"' run.json >/dev/null
            gh run view "$RUN_ID" --repo "$GH_REPO" --log > "$name.log"
          fi
          gzip "$name.log"
          gh release upload ci-evidence --repo "$GH_REPO" "$name.log.gz" --clobber
