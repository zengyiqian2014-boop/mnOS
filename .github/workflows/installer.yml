name: Unified installation ISO
on:
  workflow_dispatch:
  push:
    branches: [fix/unified-installer]
    paths: ['live/**', 'native/**', '.github/workflows/installer.yml']
permissions:
  contents: read
concurrency:
  group: installer-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  native-randomness:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install native build and VM test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ make clang lld llvm qemu-system-x86 qemu-system-arm grub-pc-bin grub-efi-amd64-bin xorriso mtools dosfstools
      - name: Compile both original kernels and test real account enrollment
        run: |
          set -euo pipefail
          make -C native -j4 all
          make -C native -f arch/arm64/Makefile -j4 all CLANG=clang LLD=ld.lld EFI_LD=lld-link OBJCOPY=llvm-objcopy
          OUT="$PWD/native/build" sh native/pack.sh demo
          c++ -std=c++17 -O2 -Wall -Wextra -Werror native/tests/random_vm.cpp -o native/build/random-vm
          native/build/random-vm native/build native/build/random-validation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-random-validation
          path: native/build/random-validation/*.log
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Build unified offline installer and original kernel
        run: ./live/build.sh installer '${{ matrix.arch }}'
      - name: Compile installer integration test
        run: c++ -std=c++17 -O2 -Wall -Wextra -Werror live/tests/install_vm.cpp -o live/out/install-vm
      - name: Verify account preflight and compiled enrollment
        run: |
          docker run --rm --network none -v "$PWD/live:/source:ro" \
            'mnos-live:installer-${{ matrix.arch }}' sh -ec '
            bash /source/tests/account-preflight.sh /usr/lib/mnos/account-preflight
            c++ -std=c++17 -O2 -Wall -Wextra -Werror /source/tests/enrollment-runtime.cpp -lutil -lcrypt -o /tmp/enrollment-test
            /tmp/enrollment-test'
          # Console/PAM authentication is exercised on the installed guest's
          # actual serial console, including wrong-password rejection below.
      - name: Verify bundled applications, compiler headers and detailed manuals
        run: |
          docker run --rm --network none -v "$PWD/live:/source:ro" \
            'mnos-live:installer-${{ matrix.arch }}' sh -ec '
            sh /source/tests/tool-environment.sh
            sh /source/tests/ctf-environment.sh
            c++ -std=c++17 -O2 -Wall -Wextra -Werror /source/tests/command-index.cpp -o /tmp/index-test
            /tmp/index-test'
      - name: Verify graphical tool center and CTF application windows
        run: |
          mkdir -p live/out/validation
          docker build --target components -t mnos-gui-test-compiler -f live/Rootfs.Dockerfile live
          docker run --rm --network none -v "$PWD/live:/source:ro" -v "$PWD/live/out/validation:/evidence" \
            mnos-gui-test-compiler sh -ec 'cc -std=c11 -O2 -Wall -Wextra -Werror /source/tests/window-capture.c $(pkg-config --cflags --libs gtk+-3.0) -o /evidence/window-capture'
          docker run --rm --network none -v "$PWD/live:/source:ro" -v "$PWD/live/out/validation:/evidence" \
            'mnos-live:installer-${{ matrix.arch }}' sh -ec '
            install -d -o 65534 -g 65534 /tmp/mnos-gui
            chown 65534:65534 /evidence
            runuser -u nobody -- env HOME=/tmp/mnos-gui timeout 180 xvfb-run -a dbus-run-session -- sh /source/tests/tool-center-gui.sh'
      - name: Install to a blank disk and boot without the ISO
        run: |
          set -euo pipefail
          mkdir -p live/out/validation
          devices=()
          if [ -c /dev/kvm ]; then devices+=(--device /dev/kvm); fi
          docker run --rm --network none --memory=7g --cpus=4 "${devices[@]}" \
            -v "$PWD/live/out:/out" mnos-live-builder \
            /out/install-vm '${{ matrix.arch }}' \
            '/out/mnOS-2.0-preview-installer-${{ matrix.arch }}.iso' /out/validation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-validation-${{ matrix.arch }}
          path: |
            live/out/validation/*.log
            live/out/validation/*.ppm
            live/out/validation/*.txt
            live/out/validation/*.png
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mnOS-installer-${{ matrix.arch }}
          path: |
            live/out/*.iso
            live/out/*.sha256
            live/out/*.tsv
            live/out/*.config
            live/out/*.txt
            live/out/validation/*.log
            live/out/validation/*.ppm
            live/out/validation/*.txt
            live/out/validation/*.png
          compression-level: 0
          retention-days: 14
