name: Publish tested native GUI and Linux guest
on:
  push:
    branches: [main]
    paths: ['.github/native-release-request.json']
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful Native GUI with real Linux guest run
        required: true
      release_tag:
        description: Native edition preview tag matching the built filenames
        required: true
        default: v0.10-native-preview.1
      authentication_run:
        description: Successful authentication run at the same source commit
        required: true
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-native-preview
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN: ${{ inputs.build_run }}
      TAG: ${{ inputs.release_tag }}
      AUTH_RUN: ${{ inputs.authentication_run }}
      EXPECTED_SHA: ''
    steps:
      - uses: actions/checkout@v4
      - name: Read the exact tested release request
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          request=.github/native-release-request.json
          build_run=$(jq -er '.build_run | strings' "$request")
          auth_run=$(jq -er '.authentication_run | strings' "$request")
          tag=$(jq -er '.release_tag | strings' "$request")
          sha=$(jq -er '.source_sha | strings' "$request")
          [[ "$build_run" =~ ^[0-9]+$ && "$auth_run" =~ ^[0-9]+$ ]]
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+-native-preview\.[0-9]+$ ]]
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'SOURCE_RUN=%s\nAUTH_RUN=%s\nTAG=%s\nEXPECTED_SHA=%s\n' "$build_run" "$auth_run" "$tag" "$sha" >> "$GITHUB_ENV"
      - name: Require a successful complete native installation and Linux guest run
        id: source
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+-native-preview\.[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" > /tmp/source.json
          jq -e --arg repo "$GH_REPO" '.repository.full_name == $repo and .path == ".github/workflows/native-linux-guest.yml" and .conclusion == "success"' /tmp/source.json
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN/jobs" > /tmp/jobs.json
          for arch in amd64 arm64; do
            jq -e --arg name "native ($arch)" 'any(.jobs[]; .name == $name and .conclusion == "success" and any(.steps[]; .name == "Install and execute guest Linux in the native desktop" and .conclusion == "success"))' /tmp/jobs.json
          done
          jq -e 'any(.jobs[]; .name == "package" and .conclusion == "success")' /tmp/jobs.json
          [[ "$AUTH_RUN" =~ ^[0-9]+$ ]]
          source_sha=$(jq -r .head_sha /tmp/source.json)
          if [ -n "$EXPECTED_SHA" ]; then test "$source_sha" = "$EXPECTED_SHA"; fi
          gh api "repos/$GH_REPO/actions/runs/$AUTH_RUN" > /tmp/auth.json
          jq -e --arg sha "$source_sha" --arg repo "$GH_REPO" '.head_sha == $sha and .repository.full_name == $repo and .path == ".github/workflows/authentication.yml" and .conclusion == "success"' /tmp/auth.json
          printf 'sha=%s\n' "$(jq -r .head_sha /tmp/source.json)" >> "$GITHUB_OUTPUT"
          printf 'run=%s\n' "$SOURCE_RUN" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: native-linux-guest-release
          run-id: ${{ steps.source.outputs.run }}
          github-token: ${{ github.token }}
          path: release
      - name: Verify the exact images, source archives and both architecture records
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(cat release/SOURCE_COMMIT.txt)" = "$SOURCE_SHA"
          grep -Fx "Validation: https://github.com/$GH_REPO/actions/runs/$SOURCE_RUN" release/PROVENANCE.txt
          (cd release && sha256sum -c SHA256SUMS)
          mkdir evidence upstream
          tar -xf release/native-installation-validation.tar.gz -C evidence
          tar -xf release/linux-guest-upstream-sources.tar -C upstream
          (cd upstream && sha256sum -c ../release/SOURCES.sha256)
          mkdir debian-sources
          tar -xf release/debian-corresponding-sources.tar -C debian-sources
          (cd debian-sources && sha256sum -c SHA256SUMS)
          test -s release/DEBIAN-PACKAGES.tsv
          grep -q 'FIRMWARE RNG BOOT PASS: CPU RNG and VirtIO RNG absent, TPM allows enrollment' evidence/firmware-validation.log
          grep -q 'FIRMWARE RNG BOOT PASS: CPU RNG and VirtIO RNG absent, TPM missing fails closed' evidence/firmware-validation.log
          version=${TAG#v}
          version=${version/-native/}
          for arch in amd64 arm64; do
            images=(release/mnOS-native-*"-$arch.iso")
            test "${#images[@]}" = 1 && test -s "${images[0]}"
            new="release/mnOS-native-$version-$arch.iso"
            if [ "${images[0]}" != "$new" ]; then mv "${images[0]}" "$new"; fi
            grep -q "NATIVE LINUX GUEST PASS $arch" "evidence/guest-validation-$arch.log"
            grep -q "LINUX APPLICATIONS PASS $arch" "evidence/guest-validation-$arch.log"
            grep -q "DESKTOP PASS $arch" "evidence/guest-validation-$arch.log"
            test -s "evidence/$arch-linux-guest-gui.ppm"
            test -s "evidence/$arch-linux-guest-consent.ppm"
            test -s "evidence/$arch-linux-guest-applications.ppm"
            test -s "evidence/$arch-linux-guest-firefox.ppm"
          done
          printf 'Authentication: https://github.com/%s/actions/runs/%s\n' "$GH_REPO" "$AUTH_RUN" >> release/PROVENANCE.txt
          cp AUTHENTICATION.md release/
          (cd release && sha256sum *.iso *.tar *.tar.gz *.config *.txt *.md *.tsv SOURCES.sha256 > SHA256SUMS && sha256sum -c SHA256SUMS)
          cat > /tmp/native-notes.md <<EOF
          自研 C / 汇编内核和原生 GUI，AMD64 / ARM64 图形安装 ISO。

          离线 ISO 内含原生系统、Linux 6.12、Debian riscv64、APT、Xorg、Xterm、twm、C++ 应用中心、Firefox ESR、Thunar、Mousepad、C++ 工具链和基础命令。安装和启动随附桌面无需下载；使用 APT 添加软件需要网络。

          原生桌面用 linux open applications 打开 Linux 应用中心，自动发现和搜索已安装的桌面应用。安装按钮打开真实 APT 终端。客体内 mnos-gui list 列应用，mnos-gui open 桌面ID 启动桌面应用，mnos-gui run 程序 [参数] 运行其他程序；复用一个 X11 会话。

          mnos-pkg install 对明确指定的 Python 相关包和 linux-libc-dev 增加默认取消的确认，随后仍保留 APT 自己的提示。头文件占用磁盘，不作为运行时库加载，安装本身不会造成内存泄漏。直接调用上游 apt 不增加此提示。

          Linux 客体内存按需分配，自动上限至多 1 GiB。停止时可用 linux memory MIB 调整。APT 和图形桌面建议至少 768 MiB 客体内存、4 GiB 宿主内存；停止或退出会擦除并回收客体页。

          系统设置提供 Support / H，终端提供 support 与 support -cn。反馈邮箱：report.mnos@proton.me、wrmfwv@163.com。help 为英文，help -cn 为中文。

          保留可选的密码 + 验证器登录、本机二维码 / 手动密钥、一次性恢复码、加密保存和重放拒绝。首次配置可跳过，之后在设置或 2fa 命令中管理。

          UEFI 启动支持从固件 RNG、TPM 2.0 或 TPM 1.2 获取启动随机种子，再由 ChaCha20 生成器提供随机数。已在关闭 CPU RNG、没有 VirtIO RNG 的 OVMF + TPM 2.0 环境中验证账号创建；无安全随机数源时仍拒绝创建。实体机需要主板实际提供并启用相应固件服务，TPM 1.2 目前通过协议单元测试，未完成实体硬件验证。

          Linux 模拟默认关闭，启动前确认。原生 VirtIO PCI/MMIO 驱动连接客体网络，图形窗口接收键盘和鼠标。每位用户有独立的 8 GiB 稀疏数据文件，安装的软件和文件在正常关机后保存。先在 Linux 中执行 poweroff，再关闭模拟。pause / resume 保留内存；空闲时让出 CPU，定时器仍正常唤醒。

          这是单核 RV64GC 软件解释器，没有硬件虚拟化或 3D 加速。APT 支持 riscv64 / all 软件包，不能直接运行 AMD64 / ARM64 的 DEB。随附 Firefox ESR 使用 Debian riscv64 构建；官方 AMD64/ARM64 VS Code 和完整 CTF 工作台仍请使用独立的 Linux Edition。软件解释较慢，应用兼容性须逐项测试；不宣称高性能生产服务器、全部硬件兼容或普通摄像头安全解锁已完成。

          两种架构均通过真实安装、移除 ISO 后启动、APT 更新及安装、应用中心、Mousepad、Firefox JavaScript 绘图、键盘鼠标和持久化测试；同一源码的验证器、包管理事务及 GTK 应用中心测试通过。实际文件大小、校验和、完整包清单、对应源码及截图日志见附件。旧 USB 驱动预览 ISO 不含本次 Linux 应用环境。

          [安装与客体测试](https://github.com/$GH_REPO/actions/runs/$SOURCE_RUN) · [认证测试](https://github.com/$GH_REPO/actions/runs/$AUTH_RUN)
          EOF
      - name: Publish the verified native preview
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --json isDraft,targetCommitish > /tmp/existing.json 2>/dev/null; then
            jq -e --arg sha "$SOURCE_SHA" '.isDraft == true and .targetCommitish == $sha' /tmp/existing.json
          else
            gh release create "$TAG" --target "$SOURCE_SHA" --draft --prerelease --title "mnOS Native Edition ${TAG#v}" --notes-file /tmp/native-notes.md
          fi
          for file in release/*; do gh release upload "$TAG" "$file" --clobber; done
          gh release edit "$TAG" --draft=false --prerelease --latest=false --notes-file /tmp/native-notes.md
