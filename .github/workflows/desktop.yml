name: Multi-architecture desktop ISO

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional preview tag to publish after every build and check passes
        type: string
        required: false
        default: ''
  push:
    branches: [feature/live-desktop]
    paths: ['live/**', 'native/**', '.github/workflows/desktop.yml']
    tags: ['v2.*-desktop-preview.*']

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build original kernel and VM tools
        run: |
          make -C native -j4 all host-tools
          make -C native host-tests | tee native/build/native-host-tests.log
          docker build -t mnos-live-builder -f live/Builder.Dockerfile live
      - name: BIOS, UEFI, SMP, large memory, filesystem, UI and power tests
        run: |
          docker run --rm --network none --memory=6g --cpus=4 -v "$PWD/native:/native:ro" \
            -v "$PWD/native/build:/out" mnos-live-builder bash -c '
              set -e
              bash /native/pack.sh test
              python3 /native/tests/boot.py /out/native-test.iso
              python3 /native/tests/smp.py /out/native-test.iso
              python3 /native/tests/large_memory.py /out/native-test.iso
              bash /native/pack.sh demo
              python3 /native/tests/ui.py /out/native-demo.iso
              python3 /native/tests/ui.py /out/native-demo.iso --gpu virtio --uefi
              python3 /native/tests/persistence.py /out/native-demo.iso
              chmod a+r /out/*.ppm /out/*.log
            '
          (cd native/build && sha256sum native-demo.iso > native-demo.iso.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: mnOS-native-checks
          path: |
            native/build/native-*.log
            native/build/native-*.ppm
            native/build/native-demo.iso
            native/build/native-demo.iso.sha256
          retention-days: 14
  build:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        profile: [qemu, hardware]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Enrollment checks
        run: |
          python3 -m unittest discover -s live/tests -p 'test_*.py'
          c++ -std=c++17 -O2 -Wall -Wextra live/tests/enrollment-runtime.cpp -lutil -lcrypt -o live/tests/enrollment-runtime
          docker build -t mnos-enrollment -f live/tests/Enrollment.Dockerfile live
          docker run --rm --init --network none -v "$PWD/live/tests:/tests:ro" mnos-enrollment /tests/enrollment-runtime
      - name: Build ISO
        id: iso
        run: ./live/build.sh "${{ matrix.profile }}" "${{ matrix.arch }}"
      - name: Check kernel and desktop tools
        run: |
          python3 live/tests/check_kernel.py "live/out/kernel-${{ matrix.profile }}-${{ matrix.arch }}.config"
          docker run --rm --init --network none -v "$PWD/live/tests:/tests:ro" \
            "mnos-live:${{ matrix.profile }}-${{ matrix.arch }}" timeout 120s xvfb-run -a \
            dbus-run-session -- python3 /tests/gui_smoke.py
      - name: Repeat first account setup in fresh containers
        if: ${{ !cancelled() && steps.iso.outcome == 'success' }}
        run: |
          for attempt in {1..5}; do
            docker run --rm --init --network none -v "$PWD/live/tests:/tests:ro" \
              "mnos-live:${{ matrix.profile }}-${{ matrix.arch }}" /tests/enrollment-runtime
          done
      - name: Check ordinary and delegated network permissions
        if: ${{ !cancelled() && steps.iso.outcome == 'success' }}
        run: |
          docker run --rm --init --network none --cap-add NET_ADMIN \
            -v "$PWD/live/tests:/tests:ro" "mnos-live:${{ matrix.profile }}-${{ matrix.arch }}" \
            python3 /tests/network_permissions.py
      - name: Compile and run development tools as an ordinary user
        if: ${{ !cancelled() && steps.iso.outcome == 'success' }}
        run: |
          docker run --rm --init --network none -v "$PWD/live/tests:/tests:ro" \
            "mnos-live:${{ matrix.profile }}-${{ matrix.arch }}" python3 /tests/development.py
      - name: Boot architecture-specific ISO entries
        if: ${{ !cancelled() && steps.iso.outcome == 'success' }}
        run: |
          mkdir -p live/out/boot-${{ matrix.profile }}-${{ matrix.arch }}
          docker run --rm --init --network none -v "$PWD/live/tests:/tests:ro" \
            -v "$PWD/live/out:/out" mnos-live-builder \
            python3 /tests/boot.py "/out/mnOS-2.0-preview-${{ matrix.profile }}-${{ matrix.arch }}.iso" \
            --arch "${{ matrix.arch }}" --output "/out/boot-${{ matrix.profile }}-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: mnOS-desktop-${{ matrix.profile }}-${{ matrix.arch }}
          path: live/out/*
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failed-checks-${{ matrix.profile }}-${{ matrix.arch }}
          path: |
            live/out/boot-*/**
            live/out/kernel-*.config
            live/out/packages-*.tsv
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [native, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish verified architecture variants and native test evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          [[ "$TAG" =~ ^v2\.0-desktop-preview\.[0-9]+$ ]] || { echo 'Invalid preview tag.' >&2; exit 2; }
          bash live/release-assets.sh release
          if gh api "repos/$GH_REPO/git/ref/tags/$TAG" > /tmp/mnos-release-ref.json 2>/dev/null; then
            jq -e --arg sha "$SOURCE_SHA" '.object.type == "commit" and .object.sha == $sha' /tmp/mnos-release-ref.json
          else
            gh api --method POST "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$SOURCE_SHA" >/dev/null
          fi
          if gh release view "$TAG" --json isDraft --jq .isDraft > /tmp/mnos-release-state 2>/dev/null; then
            test "$(cat /tmp/mnos-release-state)" = true || { echo 'Refusing to overwrite an already published release.' >&2; exit 1; }
          else
            gh release create "$TAG" --draft --prerelease --verify-tag \
              --title "mnOS Desktop $TAG" --notes-file live/RELEASE.md
          fi
          # Logs in subdirectories remain available as workflow artifacts.
          find release/publish -maxdepth 1 -type f -print0 | xargs -0 -r gh release upload "$TAG" --clobber
          gh release edit "$TAG" --notes-file live/RELEASE.md --draft=false
