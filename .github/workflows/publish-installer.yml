name: Publish verified installation ISOs
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Unified installation ISO source build run
        required: true
      verification_run:
        description: Optional successful Verify existing installation ISOs run
        required: false
      release_tag:
        description: New installer preview tag
        required: true
        default: v2.0-installer-preview.3
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN: ${{ inputs.build_run }}
      VERIFY_RUN: ${{ inputs.verification_run }}
      TAG: ${{ inputs.release_tag }}
    steps:
      - name: Verify source and both architecture tests
        id: source
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+-installer-preview\.[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" > /tmp/run.json
          jq -e --arg repo "$GH_REPO" '.repository.full_name == $repo and .path == ".github/workflows/installer.yml"' /tmp/run.json
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN/jobs" > /tmp/jobs.json
          jq -e 'any(.jobs[]; .name == "native-randomness" and .conclusion == "success")' /tmp/jobs.json
          if [ -n "$VERIFY_RUN" ]; then
            [[ "$VERIFY_RUN" =~ ^[0-9]+$ ]]
            jq -e '[.jobs[] | select(.name | startswith("build ("))] | length == 2 and all(.[]; any(.steps[]; .name == "Build unified offline installer and original kernel" and .conclusion == "success"))' /tmp/jobs.json
            gh api "repos/$GH_REPO/actions/runs/$VERIFY_RUN" > /tmp/verify.json
            jq -e --arg repo "$GH_REPO" '.conclusion == "success" and .repository.full_name == $repo and .path == ".github/workflows/retest-installer.yml"' /tmp/verify.json
            gh api "repos/$GH_REPO/actions/runs/$VERIFY_RUN/jobs" > /tmp/verify-jobs.json
            jq -e '[.jobs[] | select(.name | startswith("verify ("))] | length == 2 and all(.[]; .conclusion == "success")' /tmp/verify-jobs.json
            printf 'assets_run=%s\n' "$VERIFY_RUN" >> "$GITHUB_OUTPUT"
            printf 'sha=%s\n' "$(jq -r .head_sha /tmp/verify.json)" >> "$GITHUB_OUTPUT"
          else
            jq -e '.conclusion == "success"' /tmp/run.json
            jq -e '[.jobs[] | select(.name | startswith("build ("))] | length == 2 and all(.[]; .conclusion == "success")' /tmp/jobs.json
            printf 'assets_run=%s\n' "$SOURCE_RUN" >> "$GITHUB_OUTPUT"
            printf 'sha=%s\n' "$(jq -r .head_sha /tmp/run.json)" >> "$GITHUB_OUTPUT"
          fi
          source_sha=$(jq -r .head_sha /tmp/run.json)
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'base_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: mnOS-installer-*
          run-id: ${{ steps.source.outputs.assets_run }}
          github-token: ${{ github.token }}
          path: verified
      - uses: actions/download-artifact@v4
        with:
          name: native-random-validation
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
          path: evidence/native-randomness
      - name: Stage checked binaries and validation records
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          BASE_SHA: ${{ steps.source.outputs.base_sha }}
        run: |
          set -euo pipefail
          mkdir -p release evidence
          for arch in amd64 arm64; do
            source="verified/mnOS-installer-$arch"
            if [ -n "$VERIFY_RUN" ]; then
              test "$(cat "$source/verified-build-run.txt")" = "$SOURCE_RUN"
              test "$(cat "$source/boot-overlay-$arch.txt")" = "$SOURCE_SHA"
              test "$(cat "$source/verification-code.txt")" = "$SOURCE_SHA"
            fi
            test "$(cat "$source/source-installer-$arch.txt")" = "$BASE_SHA"
            (cd "$source" && sha256sum -c "mnOS-2.0-preview-installer-$arch.iso.sha256")
            # This release promises one downloadable ISO per architecture.
            # Stop before creating a public release if GitHub would require parts.
            bytes=$(stat -c %s "$source/mnOS-2.0-preview-installer-$arch.iso")
            if (( bytes > 2147483647 )); then
              echo "$arch ISO exceeds GitHub's single-file limit; publication stopped." >&2
              exit 1
            fi
            cp "$source"/*.iso "$source"/*.sha256 "$source"/*.tsv "$source"/*.config "$source"/*.txt release/
            # Keep the version in the public filename so old/new optical media
            # can be distinguished in VM settings. Renaming does not alter bytes.
            name="mnOS-${TAG#v}-$arch.iso"
            mv "release/mnOS-2.0-preview-installer-$arch.iso" "release/$name"
            rm "release/mnOS-2.0-preview-installer-$arch.iso.sha256"
            (cd release && sha256sum "$name" > "$name.sha256")
            cp -a "$source/validation" "evidence/$arch"
          done
          tar -czf release/installation-validation.tar.gz evidence
          printf '%s\n' "$SOURCE_SHA" > release/SOURCE_COMMIT.txt
          printf '%s\n' "$BASE_SHA" > release/PAYLOAD_COMMIT.txt
          bash live/release-assets.sh release
      - name: Publish installation media
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --json isDraft,targetCommitish > /tmp/existing.json 2>/dev/null; then
            jq -e --arg sha "$SOURCE_SHA" '.isDraft == true and .targetCommitish == $sha' /tmp/existing.json
          else
            gh release create "$TAG" --target "$SOURCE_SHA" --draft --prerelease --title 'mnOS 集成工具安装包 · 应用环境与详细命令手册（amd64 / ARM64）' --notes-file live/INSTALLER-RELEASE.md
          fi
          for file in release/publish/*; do gh release upload "$TAG" "$file" --clobber; done
          gh release view "$TAG" --json assets --jq '.assets[]|[.name,.size,.state]|@tsv'
          gh release edit "$TAG" --draft=false --prerelease --latest=false
