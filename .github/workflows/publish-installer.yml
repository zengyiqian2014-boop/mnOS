name: Publish verified installation ISOs
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Unified installation ISO source build run
        required: true
      verification_run:
        description: Optional successful Verify existing installation ISOs run
        required: false
      application_run:
        description: Supplemental application verification (required when using a separate verification run)
        required: false
      tool_center_run:
        description: Successful unchanged-payload GUI keyboard and window verification
        required: true
      release_tag:
        description: New installer preview tag
        required: true
        default: v2.0-installer-preview.4
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN: ${{ inputs.build_run }}
      VERIFY_RUN: ${{ inputs.verification_run }}
      APP_RUN: ${{ inputs.application_run }}
      GUI_RUN: ${{ inputs.tool_center_run }}
      TAG: ${{ inputs.release_tag }}
    steps:
      - name: Verify source and both architecture tests
        id: source
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+-installer-preview\.[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" > /tmp/run.json
          jq -e --arg repo "$GH_REPO" '.repository.full_name == $repo and .path == ".github/workflows/installer.yml"' /tmp/run.json
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN/jobs" > /tmp/jobs.json
          jq -e 'any(.jobs[]; .name == "native-randomness" and .conclusion == "success")' /tmp/jobs.json
          if [ -n "$VERIFY_RUN" ]; then
            [[ "$VERIFY_RUN" =~ ^[0-9]+$ ]]
            jq -e '[.jobs[] | select(.name | startswith("build ("))] | length == 2 and all(.[]; any(.steps[]; .name == "Build unified offline installer and original kernel" and .conclusion == "success"))' /tmp/jobs.json
            gh api "repos/$GH_REPO/actions/runs/$VERIFY_RUN" > /tmp/verify.json
            jq -e --arg repo "$GH_REPO" '.conclusion == "success" and .repository.full_name == $repo and (.path == ".github/workflows/retest-installer.yml" or .path == ".github/workflows/verify-tools.yml")' /tmp/verify.json
            gh api "repos/$GH_REPO/actions/runs/$VERIFY_RUN/jobs" > /tmp/verify-jobs.json
            jq -e '[.jobs[] | select(.name | startswith("verify ("))] | length == 2 and all(.[]; .conclusion == "success")' /tmp/verify-jobs.json
            printf 'assets_run=%s\n' "$VERIFY_RUN" >> "$GITHUB_OUTPUT"
            printf 'sha=%s\n' "$(jq -r .head_sha /tmp/verify.json)" >> "$GITHUB_OUTPUT"
            if [ "$(jq -r .path /tmp/verify.json)" = .github/workflows/verify-tools.yml ]; then
              printf 'verification_mode=unchanged\n' >> "$GITHUB_OUTPUT"
            else
              printf 'verification_mode=overlay\n' >> "$GITHUB_OUTPUT"
            fi
          else
            jq -e '.conclusion == "success"' /tmp/run.json
            jq -e '[.jobs[] | select(.name | startswith("build ("))] | length == 2 and all(.[]; .conclusion == "success")' /tmp/jobs.json
            # The source job itself must have exercised installed GUI apps and
            # real disk boot, not only produced an ISO or a shell prompt.
            jq -e '[.jobs[] | select(.name | startswith("build ("))] | all(.[];
              any(.steps[]; .name == "Verify graphical tool center and CTF application windows" and .conclusion == "success") and
              any(.steps[]; .name == "Verify bundled applications, compiler headers and detailed manuals" and .conclusion == "success") and
              any(.steps[]; .name == "Install to a blank disk and boot without the ISO" and .conclusion == "success"))' /tmp/jobs.json
            printf 'assets_run=%s\n' "$SOURCE_RUN" >> "$GITHUB_OUTPUT"
            printf 'sha=%s\n' "$(jq -r .head_sha /tmp/run.json)" >> "$GITHUB_OUTPUT"
          fi
          source_sha=$(jq -r .head_sha /tmp/run.json)
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'base_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
          [[ "$GUI_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$GUI_RUN" > /tmp/gui-run.json
          jq -e --arg repo "$GH_REPO" '.repository.full_name == $repo and .path == ".github/workflows/verify-tool-center.yml" and .conclusion == "success"' /tmp/gui-run.json
          gh api "repos/$GH_REPO/actions/runs/$GUI_RUN/jobs" > /tmp/gui-jobs.json
          jq -e '[.jobs[] | select(.name | startswith("gui ("))] | length == 2 and all(.[]; .conclusion == "success")' /tmp/gui-jobs.json
          printf 'gui_sha=%s\n' "$(jq -r .head_sha /tmp/gui-run.json)" >> "$GITHUB_OUTPUT"
          if [ -n "$APP_RUN" ]; then
            [[ "$APP_RUN" =~ ^[0-9]+$ ]]
            gh api "repos/$GH_REPO/actions/runs/$APP_RUN" > /tmp/app-run.json
            jq -e --arg repo "$GH_REPO" '.repository.full_name == $repo and .path == ".github/workflows/verify-applications.yml" and .conclusion == "success"' /tmp/app-run.json
            gh api "repos/$GH_REPO/actions/runs/$APP_RUN/jobs" > /tmp/app-jobs.json
            jq -e '[.jobs[] | select(.name | startswith("applications ("))] | length == 2 and all(.[]; .conclusion == "success")' /tmp/app-jobs.json
            printf 'app_sha=%s\n' "$(jq -r .head_sha /tmp/app-run.json)" >> "$GITHUB_OUTPUT"
          else
            test -z "$VERIFY_RUN"
            printf 'app_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: mnOS-installer-*
          run-id: ${{ steps.source.outputs.assets_run }}
          github-token: ${{ github.token }}
          path: verified
      - uses: actions/download-artifact@v4
        with:
          name: native-random-validation
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
          path: evidence/native-randomness
      - uses: actions/download-artifact@v4
        with:
          pattern: tool-center-input-*
          run-id: ${{ inputs.tool_center_run }}
          github-token: ${{ github.token }}
          path: evidence/tool-center-input
      - uses: actions/download-artifact@v4
        if: inputs.application_run != ''
        with:
          pattern: application-rendering-*
          run-id: ${{ inputs.application_run }}
          github-token: ${{ github.token }}
          path: evidence/applications
      - name: Stage checked binaries and validation records
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          BASE_SHA: ${{ steps.source.outputs.base_sha }}
          VERIFICATION_MODE: ${{ steps.source.outputs.verification_mode }}
          APP_SHA: ${{ steps.source.outputs.app_sha }}
          GUI_SHA: ${{ steps.source.outputs.gui_sha }}
        run: |
          set -euo pipefail
          mkdir -p release evidence
          for arch in amd64 arm64; do
            source="verified/mnOS-installer-$arch"
            if [ -n "$VERIFY_RUN" ]; then
              test "$(cat "$source/verified-build-run.txt")" = "$SOURCE_RUN"
              if [ "$VERIFICATION_MODE" = unchanged ]; then
                test "$(cat "$source/verification-mode.txt")" = unchanged
                # The verification workflow validates the original checksum
                # before and after booting; no runtime overlay is applied.
              else
                test "$(cat "$source/boot-overlay-$arch.txt")" = "$SOURCE_SHA"
              fi
              test "$(cat "$source/verification-code.txt")" = "$SOURCE_SHA"
            fi
            test "$(cat "$source/source-installer-$arch.txt")" = "$BASE_SHA"
            (cd "$source" && sha256sum -c "mnOS-2.0-preview-installer-$arch.iso.sha256")
            gui="evidence/tool-center-input/tool-center-input-$arch"
            test "$(cat "$gui/build-run.txt")" = "$SOURCE_RUN"
            test "$(cat "$gui/gui-test-commit.txt")" = "$GUI_SHA"
            cmp "$source/mnOS-2.0-preview-installer-$arch.iso.sha256" "$gui/mnOS-2.0-preview-installer-$arch.iso.sha256"
            test -s "$gui/command-search.png"
            grep -q 'GUI CTF PASS' "$gui/gui-test.log"
            if [ -n "$APP_RUN" ]; then
              application="evidence/applications/application-rendering-$arch"
              test "$(cat "$application/installer-verification-run.txt")" = "$VERIFY_RUN"
              test "$(cat "$application/application-test-commit.txt")" = "$APP_SHA"
              cmp "$source/mnOS-2.0-preview-installer-$arch.iso.sha256" "$application/mnOS-2.0-preview-installer-$arch.iso.sha256"
            else
              test -s "$source/validation/ctf-workbench.png"
              test -s "$source/validation/ghex.png"
              test -s "$source/validation/sqlitebrowser.png"
              test -s "$source/validation/wireshark.png"
            fi
            # This release promises one downloadable ISO per architecture.
            # Stop before creating a public release if GitHub would require parts.
            bytes=$(stat -c %s "$source/mnOS-2.0-preview-installer-$arch.iso")
            if (( bytes > 2147483647 )); then
              echo "$arch ISO exceeds GitHub's single-file limit; publication stopped." >&2
              exit 1
            fi
            cp "$source"/*.iso "$source"/*.sha256 "$source"/*.tsv "$source"/*.config "$source"/*.txt release/
            # Keep the version in the public filename so old/new optical media
            # can be distinguished in VM settings. Renaming does not alter bytes.
            name="mnOS-${TAG#v}-$arch.iso"
            mv "release/mnOS-2.0-preview-installer-$arch.iso" "release/$name"
            rm "release/mnOS-2.0-preview-installer-$arch.iso.sha256"
            (cd release && sha256sum "$name" > "$name.sha256")
            cp -a "$source/validation" "evidence/$arch"
          done
          tar -czf release/installation-validation.tar.gz evidence
          printf '%s\n' "$SOURCE_SHA" > release/SOURCE_COMMIT.txt
          printf '%s\n' "$BASE_SHA" > release/PAYLOAD_COMMIT.txt
          printf '%s\n' "$APP_SHA" > release/APPLICATION_TEST_COMMIT.txt
          printf '%s\n' "$GUI_SHA" > release/GUI_TEST_COMMIT.txt
          bash live/release-assets.sh release
      - name: Publish installation media
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --json isDraft,targetCommitish > /tmp/existing.json 2>/dev/null; then
            jq -e --arg sha "$SOURCE_SHA" '.isDraft == true and .targetCommitish == $sha' /tmp/existing.json
          else
            gh release create "$TAG" --target "$SOURCE_SHA" --draft --prerelease --title 'mnOS 图形工具中心 · Linux 命令库与 CTF 工作台（AMD64 / ARM64）' --notes-file live/INSTALLER-RELEASE.md
          fi
          for file in release/publish/*; do gh release upload "$TAG" "$file" --clobber; done
          gh release view "$TAG" --json assets --jq '.assets[]|[.name,.size,.state]|@tsv'
          gh release edit "$TAG" --draft=false --prerelease --latest=false
