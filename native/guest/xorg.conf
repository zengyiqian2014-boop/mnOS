Section "ServerFlags"
    Option "AutoAddDevices" "false"
    Option "AutoEnableDevices" "true"
    Option "AllowMouseOpenFail" "true"
EndSection
Section "Device"
    Identifier "mnOS framebuffer"
    Driver "fbdev"
    Option "fbdev" "/dev/fb0"
EndSection
Section "Monitor"
    Identifier "mnOS screen"
EndSection
Section "Screen"
    Identifier "Screen"
    Device "mnOS framebuffer"
    Monitor "mnOS screen"
    DefaultDepth 24
EndSection
Section "InputDevice"
    Identifier "Keyboard"
    Driver "evdev"
    Option "Device" "/dev/input/event0"
    Option "XkbLayout" "us"
EndSection
Section "InputDevice"
    Identifier "Pointer"
    Driver "evdev"
    Option "Device" "/dev/input/event1"
EndSection
Section "ServerLayout"
    Identifier "mnOS Linux window"
    Screen "Screen"
    InputDevice "Keyboard" "CoreKeyboard"
    InputDevice "Pointer" "CorePointer"
EndSection
