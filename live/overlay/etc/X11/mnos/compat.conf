# CPU rendering while preserving the kernel's DRM/KMS display driver.
Section "Device"
    Identifier "mnOS compatibility display"
    Driver "modesetting"
    Option "AccelMethod" "none"
    Option "SWcursor" "true"
    Option "PageFlip" "false"
EndSection

Section "ServerFlags"
    Option "BlankTime" "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
EndSection
