---
mode: required
method: legacy
default: root
labels:
  step: Network permissions
  step[zh_CN]: 网络工具权限
items:
  - id: root
    name: Require administrator authorization
    name[zh_CN]: 特权操作需要管理员授权（默认）
    description: Ordinary networking and TCP-connect scans work as your user. Raw scans, packet capture and network configuration require sudo. No network capabilities are delegated.
    description[zh_CN]: 普通联网和 TCP 连接扫描无需 root。原始报文扫描、抓包及网络配置需要 sudo，不向普通账号委派网络特权。
    screenshot: /usr/share/icons/hicolor/scalable/apps/mnos.svg
  - id: netadmin
    name: Delegate network administration to this account
    name[zh_CN]: 向此普通账号开放网络管理权限
    description: Authorize the account created here to run mnos-net with NET_ADMIN and NET_RAW. Nmap, tcpdump, ip, tc and iw can scan, capture and alter networking without sudo. UID stays unprivileged; this also permits changing routes and firewall-related network state. Other users are not automatically authorized.
    description[zh_CN]: 授权本次创建的账号通过 mnos-net 使用 NET_ADMIN 和 NET_RAW。Nmap、tcpdump、ip、tc、iw 可免 sudo 扫描、抓包和修改网络（包括网卡、路由等）。账号仍是普通 UID，其他账号不会自动获得授权。
    screenshot: /usr/share/icons/hicolor/scalable/apps/mnos.svg
