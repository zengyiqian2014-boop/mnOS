# Calamares' compiled contextualprocess module shell-quotes ${USER}.
# The compiled mnOS backend independently validates the account and real UID.
---
dontChroot: false
timeout: 30
packagechooser_packagechooser:
  root: /usr/sbin/mnos-network-policy root
  netadmin: /usr/sbin/mnos-network-policy netadmin ${USER}
  "*": /usr/bin/false
