# Let login/PAM collect the account name. agetty's own prompt rejects names
# above 42 bytes even though the account database and PAM support longer names.
# --skip-login skips only that prompt; no -f/autologin or authentication bypass.
[Service]
ExecStart=
ExecStart=-/sbin/agetty --skip-login --login-options '--' --noreset --noclear - ${TERM}
